# Verificación mínima del CLAUDE.md en cada push y PR: compila, pasa lint y las pruebas
# unitarias. Las pruebas en emulador (connectedDebugAndroidTest) se siguen corriendo a mano.
name: Android CI

on:
  push:
    branches: [develop, master, "feature/**"]
  pull_request:
    branches: [develop, master]

# Un push nuevo a la misma rama cancela la verificación anterior, que ya no importa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Descarga Gradle y guarda su caché entre ejecuciones.
      - uses: gradle/actions/setup-gradle@v4

      # google-services.json real no está en el repositorio. Para compilar basta uno con la
      # misma forma y valores falsos: el CI no ejecuta la app ni habla con Firebase.
      - name: Use placeholder Firebase config
        run: cp .github/ci/google-services.json app/google-services.json

      - name: Build, lint and unit tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      # Reportes de lint y de pruebas para revisar un fallo sin repetirlo en local.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
