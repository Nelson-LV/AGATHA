# Distribución de la app por Firebase App Distribution.
#   develop -> AGATHA QA (com.hivend.agatha.qa) al grupo equipo-desarrollo
#   master  -> AGATHA    (com.hivend.agatha)    al grupo tecnicos-piloto
# Primero corre build, lint y pruebas: si fallan no se distribuye nada.
# Secrets (Settings > Secrets and variables > Actions): GOOGLE_SERVICES_JSON,
# FIREBASE_SERVICE_ACCOUNT_JSON, RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
name: Android distribution

on:
  push:
    branches: [develop, master]
    # Un cambio solo de documentación no genera una versión nueva.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "graphify-out/**"
  # Botón "Run workflow" en la pestaña Actions (solo aparece cuando este archivo está en master).
  workflow_dispatch:
    inputs:
      variant:
        description: "Qué versión distribuir"
        type: choice
        options: [qa, release]
        default: qa

# Dos pushes seguidos a la misma rama: solo se distribuye el último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Test and distribute
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # El versionCode es el número de commits: hace falta el historial completo.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Choose variant
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            variant="${{ inputs.variant }}"
          elif [ "${{ github.ref_name }}" = "master" ]; then
            variant="release"
          else
            variant="qa"
          fi
          # Nombre de la tarea de Gradle: assembleQa / assembleRelease.
          task="$(echo "${variant:0:1}" | tr '[:lower:]' '[:upper:]')${variant:1}"
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "Distribuyendo la variante $variant desde ${{ github.ref_name }}"

      # Los archivos secretos solo existen durante esta ejecución, fuera del repositorio.
      - name: Restore secret files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/agatha-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/agatha-release.jks" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Build, lint and unit tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      - name: Build and upload to Firebase App Distribution
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew assemble${{ steps.variant.outputs.task }}
          appDistributionUpload${{ steps.variant.outputs.task }} --stacktrace

      - name: Remove secret files
        if: always()
        run: rm -f app/google-services.json "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/agatha-release.jks"
