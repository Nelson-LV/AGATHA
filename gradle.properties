# Project-wide Gradle settings.

# JVM heap used by the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable the Gradle build cache and configuration cache for faster builds.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# AndroidX package structure. Required for AndroidX-only projects.
android.useAndroidX=true

# Disable unused AGP features we don't need, for faster builds.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
